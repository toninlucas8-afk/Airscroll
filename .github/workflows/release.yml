name: Release

# Pubblica una Release con l'APK allegato quando si spinge un tag `vX.Y.Z`.
#
# Gli artifact delle Actions sono zip e richiedono di essere loggati: scomodi da
# telefono. Una Release invece da' un link diretto al file .apk, che Android
# apre e installa senza passaggi intermedi.

on:
  # Da terminale: `git tag v0.1.0 && git push origin v0.1.0`.
  push:
    tags: ["v*"]
  # Dal browser, anche da telefono: Actions -> Release -> "Run workflow".
  # Il tag viene creato dalla pubblicazione stessa, quindi non serve un terminale.
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da pubblicare (es. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Su workflow_dispatch prende l'input; su push di un tag, il nome del tag.
      TAG: ${{ inputs.version || github.ref_name }}
      # Se il repository ha i secret della firma li usiamo, altrimenti si resta
      # sulla chiave di debug: l'APK e' comunque installabile.
      HAS_KEYSTORE: ${{ secrets.AIRSCROLL_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Prepare signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.AIRSCROLL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AIRSCROLL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AIRSCROLL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AIRSCROLL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/airscroll.jks"
          {
            echo "AIRSCROLL_KEYSTORE=$RUNNER_TEMP/airscroll.jks"
            echo "AIRSCROLL_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "AIRSCROLL_KEY_ALIAS=$KEY_ALIAS"
            echo "AIRSCROLL_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease -PairscrollVersionName="${TAG#v}"


      # "Tutto gira offline" deve essere una proprieta' del pacchetto, non una
      # promessa. Senza il permesso INTERNET, Android impedisce di aprire un
      # socket: qui si controlla che nessuna libreria lo abbia reintrodotto.
      - name: Verify the app cannot reach the network
        run: python3 tools/check_no_network.py

      - name: Verify the model is packaged
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $apk"
          python3 tools/verify_apk.py "$apk"

      - name: Prepare artifact
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$apk"
          cp "$apk" "AirScroll-${TAG}.apk"
          sha256sum "AirScroll-${TAG}.apk" > "AirScroll-${TAG}.apk.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Scarica **`AirScroll-VERSION.apk`** qui sotto e aprilo sul telefono.

          ## Android dira' che l'app e' pericolosa. Ecco perche'.

          AirScroll chiede la fotocamera **insieme** al servizio di accessibilita'. E' esattamente la combinazione che usano gli stalkerware, quindi Android la tratta con sospetto a prescindere da cosa faccia davvero l'app. Succedono due cose distinte:

          **1. Play Protect: "app dannosa"**
          Compare all'installazione. E' un giudizio automatico basato sui permessi richiesti e sul fatto che l'app non arriva da uno store, non su un'analisi del codice. Scegli **"Installa comunque"** / *Install anyway*.

          **2. "Impostazione bloccata" sull'accessibilita' (Android 13+)**
          Il servizio di accessibilita' risultera' grigio e non attivabile. Non e' un errore dell'app: Android blocca i permessi sensibili per tutto cio' che non arriva da uno store. Si sblocca una volta sola:
          1. Impostazioni -> App -> AirScroll
          2. tocca i **tre puntini** in alto a destra
          3. **"Consenti impostazioni con restrizioni"**

          L'app te lo spiega anche al primo avvio, con un pulsante che ti porta dritto a quella schermata.

          **Perche' puoi verificare invece di fidarti:** AirScroll non dichiara il permesso `INTERNET`. Non e' una promessa, e' un fatto controllabile: apri `app/src/main/AndroidManifest.xml`, l'elenco dei permessi e' di dodici righe. Il servizio di accessibilita' e' configurato con `canRetrieveWindowContent="false"`, cioe' non puo' leggere i contenuti dello schermo nemmeno volendo. Tutto il codice e' qui.

          ## Prima installazione
          1. Consenti l'installazione da fonti sconosciute, poi installa.
          2. Apri AirScroll e concedi i permessi: fotocamera, accessibilita' (vedi sopra), sovrapposizione, notifiche.
          3. Fai la calibrazione, una quindicina di secondi.
          4. Accendi l'interruttore **dalla schermata dell'app**: Android concede la fotocamera in background solo se il servizio parte con l'app aperta.
          5. Su Xiaomi, Huawei, Samsung e simili: togli AirScroll dalle ottimizzazioni batteria, altrimenti il servizio viene chiuso dopo pochi minuti.

          ## Da sapere
          - Requisito minimo: Android 8.0 (API 26).
          - Architettura, dettagli tecnici e la sezione **Limiti** stanno nel [README](https://github.com/toninlucas8-afk/Airscroll#readme).
          NOTES
          sed -i "s/AirScroll-VERSION.apk/AirScroll-${TAG}.apk/g" notes.md

          # Senza chiave di firma stabile ogni build viene firmata con una chiave
          # diversa, e Android rifiuta di installarla sopra la precedente: si
          # deve disinstallare, e **la calibrazione e le impostazioni vanno
          # perse**. Non e' una nota a pie' di pagina: e' la prima cosa da
          # sapere prima di scaricare.
          if [ "${HAS_KEYSTORE}" != "true" ]; then
            {
              echo "> ⚠️ **Questa versione non e' firmata con una chiave stabile.**"
              echo "> Per installarla dovrai **disinstallare la versione precedente**, e"
              echo "> con essa perderai calibrazione e impostazioni. Si risolve una volta"
              echo "> sola: vedi [docs/firma.md](https://github.com/toninlucas8-afk/Airscroll/blob/main/docs/firma.md)."
              echo
              cat notes.md
            } > notes-con-avviso.md
            mv notes-con-avviso.md notes.md
          fi
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "AirScroll ${TAG}" \
            --notes-file notes.md \
            "AirScroll-${TAG}.apk" \
            "AirScroll-${TAG}.apk.sha256" \
            "docs/AirScroll-manuale.pdf" \
            "docs/AirScroll-privacy.pdf"
