name: Release

# Pubblica una Release con l'APK allegato quando si spinge un tag `vX.Y.Z`.
#
# Gli artifact delle Actions sono zip e richiedono di essere loggati: scomodi da
# telefono. Una Release invece da' un link diretto al file .apk, che Android
# apre e installa senza passaggi intermedi.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Prepare artifact
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$apk"
          cp "$apk" "AirScroll-${GITHUB_REF_NAME}.apk"
          sha256sum "AirScroll-${GITHUB_REF_NAME}.apk" > "AirScroll-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Scarica il file `.apk` qui sotto e aprilo sul telefono.

          **Prima installazione**
          1. Android chiedera' di consentire l'installazione da fonti sconosciute: e' normale per un'app fuori dal Play Store.
          2. Apri AirScroll e concedi i permessi: fotocamera, servizio di accessibilita', sovrapposizione, notifiche.
          3. Fai la calibrazione (una quindicina di secondi).
          4. Accendi l'interruttore **dalla schermata dell'app**: Android lascia usare la fotocamera in background solo se il servizio parte mentre l'app e' visibile.
          5. Su Xiaomi, Huawei, Samsung e simili: togli AirScroll dalle ottimizzazioni batteria, altrimenti il servizio viene chiuso dopo pochi minuti.

          **Da sapere**
          - L'APK e' firmato con la chiave di debug. Si installa senza problemi, ma non e' una firma di distribuzione: per aggiornare da una versione firmata diversamente va disinstallata la precedente.
          - Requisito minimo: Android 8.0 (API 26).
          - Tutto gira sul dispositivo. L'app non dichiara il permesso `INTERNET`.

          Architettura, dettagli tecnici e la sezione **Limiti** (con i vincoli di Android che vale la pena conoscere prima di provarla) stanno nel [README](https://github.com/toninlucas8-afk/Airscroll#readme).
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            --title "AirScroll ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "AirScroll-${GITHUB_REF_NAME}.apk" \
            "AirScroll-${GITHUB_REF_NAME}.apk.sha256"
