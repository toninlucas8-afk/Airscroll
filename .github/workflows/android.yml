name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Lint
        run: ./gradlew --no-daemon :app:lintRelease
        continue-on-error: true

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease


      - name: Verify the model is packaged
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $apk"
          if ! unzip -l "$apk" | grep -q "assets/gesture_recognizer.task"; then
            echo "::error::L'APK non contiene gesture_recognizer.task. Senza modello il riconoscimento della mano non parte e l'app sembra semplicemente non vedere niente."
            echo "Asset presenti:"
            unzip -l "$apk" | grep "assets/" || echo "  (nessuno)"
            exit 1
          fi
          size=$(unzip -l "$apk" | grep "assets/gesture_recognizer.task" | awk '{print $1}')
          echo "Modello presente nell'APK: $size byte."
          test "$size" -gt 1000000

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airscroll-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airscroll-test-reports
          path: "**/build/reports/"
          if-no-files-found: ignore
