name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Lint
        run: ./gradlew --no-daemon :app:lintRelease
        continue-on-error: true

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease


      - name: Verify the model is packaged
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $apk"
          python3 - "$apk" <<'CHECK'
          import sys, zipfile
          apk = zipfile.ZipFile(sys.argv[1])
          name = "assets/gesture_recognizer.task"
          if name not in apk.namelist():
              print(f"::error::L'APK non contiene {name}. Senza modello il riconoscimento non parte.")
              print("Asset presenti:", [n for n in apk.namelist() if n.startswith("assets/")])
              sys.exit(1)
          info = apk.getinfo(name)
          if info.file_size < 1_000_000:
              print(f"::error::Il modello e' troppo piccolo: {info.file_size} byte. Download troncato?")
              sys.exit(1)
          # ZIP_STORED = 0. MediaPipe apre il modello con AssetManager.openFd(),
          # che funziona solo su asset non compressi: se e' DEFLATED l'app si
          # installa, la fotocamera va, e nessun gesto viene mai riconosciuto.
          if info.compress_type != zipfile.ZIP_STORED:
              print("::error::Il modello e' compresso dentro l'APK. MediaPipe non riuscira' a caricarlo: serve `noCompress += \"task\"` nel modulo :app.")
              sys.exit(1)
          print(f"Modello presente e non compresso: {info.file_size:,} byte.")
          CHECK

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airscroll-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airscroll-test-reports
          path: "**/build/reports/"
          if-no-files-found: ignore
