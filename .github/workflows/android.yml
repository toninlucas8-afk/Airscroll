name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Lint
        run: ./gradlew --no-daemon :app:lintRelease
        continue-on-error: true

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease


      - name: Verify the model is packaged
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $apk"
          python3 tools/verify_apk.py "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airscroll-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airscroll-test-reports
          path: "**/build/reports/"
          if-no-files-found: ignore

  # Il riconoscimento acceso davvero, su un Android vero (emulato).
  #
  # Quattro versioni pubblicate e inservibili per quattro cause diverse - modello
  # assente, modello compresso, libreria nativa non allineata, MediaPipe rotto da
  # R8 - e nessuna di esse era visibile ai test unitari, alla lint o alla
  # compilazione. Esistono solo dentro l'APK, in esecuzione.
  #
  # Questo lavoro installa la variante *release*, quella che viene pubblicata, e
  # verifica che MediaPipe si avvii e risponda a un fotogramma.
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # L'emulatore senza accelerazione hardware e' cosi' lento da essere
      # inutilizzabile: qui si concede l'accesso a /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the recognition test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew --no-daemon :app:connectedReleaseAndroidTest

      # Un lavoro verde non vuol dire che qualcosa sia stato verificato: se
      # nessun test viene trovato, `connectedAndroidTest` passa in silenzio.
      # Questo passo legge i risultati veri e pretende che i test ci siano.
      - name: Verify the device tests actually ran
        run: python3 tools/check_device_tests.py

      - name: Upload the device test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airscroll-device-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
